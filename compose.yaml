services:
  db:
    image: postgres:18
    container_name: ticketeer-db
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketeer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketeer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: